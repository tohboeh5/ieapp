name: Release Publish

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: GitHub Actions run ID that uploaded the verified candidate bundle
        required: true
        type: string

permissions: {}

jobs:
  preflight:
    name: Verify exact candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      candidate_id: ${{ steps.resolve.outputs.candidate_id }}
      version: ${{ steps.resolve.outputs.version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      # The verifier is pinned to the commit that owns this workflow. It must
      # never move with the default branch while a candidate is being promoted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ugoite-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: target/artifacts

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false

      - name: Resolve candidate identity from manifest bytes
        id: resolve
        env:
          UGOITE_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          manifest=target/artifacts/candidate-manifest.json
          deno run -A tools/release.ts verify-candidate \
            --candidate "$manifest"
          candidate_id="$(deno run -A tools/release.ts candidate-id --candidate "$manifest")"
          version="$(MANIFEST_PATH="$manifest" deno eval 'const m = JSON.parse(await Deno.readTextFile(Deno.env.get("MANIFEST_PATH")!)); console.log(m.version);')"
          source_sha="$(MANIFEST_PATH="$manifest" deno eval 'const m = JSON.parse(await Deno.readTextFile(Deno.env.get("MANIFEST_PATH")!)); console.log(m.source_sha);')"
          {
            echo "candidate_id=${candidate_id}"
            echo "version=${version}"
            echo "source_sha=${source_sha}"
          } >>"${GITHUB_OUTPUT}"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Smoke exact candidate bytes and image digest
        env:
          UGOITE_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: mise run release:verify-candidate-smoke -- --candidate target/artifacts/candidate-manifest.json

      - name: Record candidate state
        run: echo 'state=verified' >>"${GITHUB_STEP_SUMMARY}"

  promote:
    name: Promote exact candidate
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
    outputs:
      candidate_id: ${{ needs.preflight.outputs.candidate_id }}
      version: ${{ needs.preflight.outputs.version }}
      source_sha: ${{ needs.preflight.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ugoite-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: target/artifacts

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@ugoite'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Confirm candidate identity before promotion
        env:
          EXPECTED_CANDIDATE_ID: ${{ needs.preflight.outputs.candidate_id }}
        run: |
          set -euo pipefail
          actual="$(deno run -A tools/release.ts candidate-id --candidate target/artifacts/candidate-manifest.json)"
          test "$actual" = "$EXPECTED_CANDIDATE_ID"

      - name: Verify exact candidate without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          UGOITE_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          mise run release:verify-candidate -- \
            --candidate target/artifacts/candidate-manifest.json

      - name: Promote exact candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          UGOITE_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: mise run release:promote -- --candidate target/artifacts/candidate-manifest.json

      - name: Record candidate state
        run: echo 'state=versioned-published' >>"${GITHUB_STEP_SUMMARY}"

  verify-distribution:
    name: Verify published distribution
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@ugoite'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify versioned distribution surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          UGOITE_GITHUB_REPO: ${{ github.repository }}
          UGOITE_RELEASE_TOKEN: ${{ github.token }}
          UGOITE_RELEASE_SHA: ${{ needs.promote.outputs.source_sha }}
          UGOITE_RELEASE_TAG: v${{ needs.promote.outputs.version }}
          UGOITE_VERSION: ${{ needs.promote.outputs.version }}
          UGOITE_CANDIDATE_ID: ${{ needs.promote.outputs.candidate_id }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-distribution.sh

      - name: Record distribution state
        run: echo 'state=distribution-verified' >>"${GITHUB_STEP_SUMMARY}"

  publish-channel-release-notes:
    name: Announce stable release
    needs:
      - promote
      - verify-distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false

      - name: Publish repository-owned stable release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.promote.outputs.version }}
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          notes_file="$(mktemp)"
          trap 'rm -f "${body_file}" "${notes_file}"' EXIT
          gh release view "${RELEASE_TAG}" --json body --jq .body >"${body_file}"
          deno run -A tools/release-notes.ts compose --channel stable --version "${RELEASE_VERSION}" --body-file "${body_file}" --output "${notes_file}"
          gh release edit "${RELEASE_TAG}" --notes-file "${notes_file}"
          echo "state=announced" >> "$GITHUB_STEP_SUMMARY"

      - name: Record release state
        run: echo 'state=announced' >>"${GITHUB_STEP_SUMMARY}"

  promote-aliases:
    name: Promote mutable aliases
    needs:
      - promote
      - verify-distribution
      - publish-channel-release-notes
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ugoite-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: target/artifacts

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@ugoite'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Update mutable aliases after distribution verification
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          UGOITE_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: mise run release:promote:aliases -- --candidate target/artifacts/candidate-manifest.json
