name: Release Publish

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: GitHub Actions run ID that uploaded the verified candidate bundle
        required: true
        type: string

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ugoite-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: target/artifacts

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@ugoite'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve candidate identity
        id: resolve
        run: |
          set -euo pipefail
          deno eval '
          const manifest = JSON.parse(await Deno.readTextFile("target/artifacts/candidate-manifest.json"));
          const runId = Deno.env.get("CANDIDATE_RUN_ID");
          if (manifest.ci_run_id !== runId) {
            throw new Error("candidate manifest ci_run_id does not match the selected run");
          }
          if (!/^[0-9a-f]{40}$/.test(manifest.source_sha ?? "")) {
            throw new Error("candidate source SHA is not immutable");
          }
          await Deno.writeTextFile(
            Deno.env.get("GITHUB_OUTPUT")!,
            `version=${manifest.version}\nsource_sha=${manifest.source_sha}\n`,
            { append: true },
          );
          '
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}

      - name: Verify exact candidate before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:verify-candidate -- --candidate target/artifacts/candidate-manifest.json --candidate-run-id "${{ inputs.candidate_run_id }}"

      - name: Verify exact candidate assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:verify-candidate-assets -- --candidate target/artifacts/candidate-manifest.json --candidate-run-id "${{ inputs.candidate_run_id }}"

      - name: Promote exact candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          mise run release:promote -- --candidate target/artifacts/candidate-manifest.json --candidate-run-id "${{ inputs.candidate_run_id }}"
          echo "state=versioned-published" >> "$GITHUB_STEP_SUMMARY"

  verify-published-distribution:
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify published distribution identity and availability
        env:
          UGOITE_IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          UGOITE_RELEASE_TOKEN: ${{ github.token }}
          UGOITE_RELEASE_SHA: ${{ needs.promote.outputs.source_sha }}
          UGOITE_RELEASE_TAG: v${{ needs.promote.outputs.version }}
          UGOITE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          bash scripts/verify-release-distribution.sh
          echo "state=distribution-verified" >> "$GITHUB_STEP_SUMMARY"

  publish-channel-release-notes:
    needs:
      - promote
      - verify-published-distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false

      - name: Publish repository-owned stable release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.promote.outputs.version }}
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          notes_file="$(mktemp)"
          trap 'rm -f "${body_file}" "${notes_file}"' EXIT
          gh release view "${RELEASE_TAG}" --json body --jq .body >"${body_file}"
          deno run -A tools/release-notes.ts compose --channel stable --version "${RELEASE_VERSION}" --body-file "${body_file}" --output "${notes_file}"
          gh release edit "${RELEASE_TAG}" --notes-file "${notes_file}"
          echo "state=announced" >> "$GITHUB_STEP_SUMMARY"

  promote-aliases:
    needs:
      - promote
      - verify-published-distribution
      - publish-channel-release-notes
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ugoite-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: target/artifacts

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@ugoite'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Update mutable aliases only after publication verification
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          mise run release:promote:aliases -- --candidate target/artifacts/candidate-manifest.json --candidate-run-id "${{ inputs.candidate_run_id }}"
          echo "state=announced" >> "$GITHUB_STEP_SUMMARY"
