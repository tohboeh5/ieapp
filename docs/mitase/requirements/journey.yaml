schema: mitase/spec/v1
kind: requirements
namespace: journey
category: Cross-surface Golden Knowledge Journey outcome semantics
requirements:
  - id: REQ-JOURNEY-001
    title: Golden Knowledge Journey outcome
    description: 'JOURNEY-KNOWLEDGE-001 carries one Knowledge outcome across Space create, Form establish, Entry create, Entry edit, Search, History, Restore, and Reopen. Criteria state durable postconditions, never surface interaction steps; every surface must reach the same outcome with equivalent meaning.'
    priority: high
    status: implemented
    criteria:
      - id: space-establish
        kind: behavior
        statement: Given an empty usable Space request, a durable Space comes into existence and reopens with identical compatibility semantics regardless of surface.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: form-establish
        kind: behavior
        statement: The user can establish a Form defining the schema used by a subsequent Entry, and the persisted Form carries equivalent schema semantics regardless of surface.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: entry-create
        kind: behavior
        statement: Creating an Entry produces an equivalent Knowledge object and appends exactly one revision.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: entry-edit
        kind: behavior
        statement: Editing an Entry appends a new revision under identical optimistic-concurrency and validation semantics, and a stale parent revision conflicts instead of overwriting.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: search-keyword
        kind: behavior
        statement: The updated durable Entry is discoverable under identical keyword conditions regardless of surface.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: entry-history
        kind: behavior
        statement: Create and edit remain observable as append-only history without rewriting prior revisions.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: entry-restore
        kind: behavior
        statement: Restoring a historical revision appends a new revision replaying that content instead of destructively rolling back, and history never shortens.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: reopen
        kind: behavior
        statement: Across process and session boundaries the same durable Space, history, and search outcome read back identically.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
    bindings:
      - id: journey-frontend-verification
        role: verification
        facet: verification
        responsibility: Verify every journey postcondition through the exact server-backed browser journey cases. CLI core and CLI remote evidence attach to the same criteria in later workstream steps without duplicating them.
        targets:
          - id: space-case
            adapter: typescript
            path: e2e/knowledge-journey.test.ts
            selector: { kind: test, name: 'JOURNEY-KNOWLEDGE-001: Space create is durable and reopenable' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.space-establish
                covers:
                  - FEAT-JOURNEY-001#binding.frontend/target.space-api
                runner: { runner: e2e-playwright, arguments: { file: e2e/knowledge-journey.test.ts, test: 'JOURNEY-KNOWLEDGE-001: Space create is durable and reopenable' } }
          - id: form-case
            adapter: typescript
            path: e2e/knowledge-journey.test.ts
            selector: { kind: test, name: 'JOURNEY-KNOWLEDGE-001: Form establish carries equivalent schema semantics' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.form-establish
                covers:
                  - FEAT-JOURNEY-001#binding.frontend/target.form-api
                runner: { runner: e2e-playwright, arguments: { file: e2e/knowledge-journey.test.ts, test: 'JOURNEY-KNOWLEDGE-001: Form establish carries equivalent schema semantics' } }
          - id: entry-create-case
            adapter: typescript
            path: e2e/knowledge-journey.test.ts
            selector: { kind: test, name: 'JOURNEY-KNOWLEDGE-001: Entry create appends exactly one revision' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-create
                covers:
                  - FEAT-JOURNEY-001#binding.frontend/target.entry-api
                runner: { runner: e2e-playwright, arguments: { file: e2e/knowledge-journey.test.ts, test: 'JOURNEY-KNOWLEDGE-001: Entry create appends exactly one revision' } }
          - id: entry-edit-case
            adapter: typescript
            path: e2e/knowledge-journey.test.ts
            selector: { kind: test, name: 'JOURNEY-KNOWLEDGE-001: Entry edit enforces optimistic concurrency' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-edit
                covers:
                  - FEAT-JOURNEY-001#binding.frontend/target.entry-api
                runner: { runner: e2e-playwright, arguments: { file: e2e/knowledge-journey.test.ts, test: 'JOURNEY-KNOWLEDGE-001: Entry edit enforces optimistic concurrency' } }
          - id: search-case
            adapter: typescript
            path: e2e/knowledge-journey.test.ts
            selector: { kind: test, name: 'JOURNEY-KNOWLEDGE-001: Search finds the updated durable entry' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.search-keyword
                covers:
                  - FEAT-JOURNEY-001#binding.frontend/target.search-api
                runner: { runner: e2e-playwright, arguments: { file: e2e/knowledge-journey.test.ts, test: 'JOURNEY-KNOWLEDGE-001: Search finds the updated durable entry' } }
          - id: history-case
            adapter: typescript
            path: e2e/knowledge-journey.test.ts
            selector: { kind: test, name: 'JOURNEY-KNOWLEDGE-001: History stays append-only across create and edit' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-history
                covers:
                  - FEAT-JOURNEY-001#binding.frontend/target.entry-api
                runner: { runner: e2e-playwright, arguments: { file: e2e/knowledge-journey.test.ts, test: 'JOURNEY-KNOWLEDGE-001: History stays append-only across create and edit' } }
          - id: restore-case
            adapter: typescript
            path: e2e/knowledge-journey.test.ts
            selector: { kind: test, name: 'JOURNEY-KNOWLEDGE-001: Restore appends a new revision without shortening history' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-restore
                covers:
                  - FEAT-JOURNEY-001#binding.frontend/target.entry-api
                runner: { runner: e2e-playwright, arguments: { file: e2e/knowledge-journey.test.ts, test: 'JOURNEY-KNOWLEDGE-001: Restore appends a new revision without shortening history' } }
          - id: reopen-case
            adapter: typescript
            path: e2e/knowledge-journey.test.ts
            selector: { kind: test, name: 'JOURNEY-KNOWLEDGE-001: Reopen reads identical durable state' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.reopen
                covers:
                  - FEAT-JOURNEY-001#binding.frontend/target.space-api
                  - FEAT-JOURNEY-001#binding.frontend/target.entry-api
                  - FEAT-JOURNEY-001#binding.frontend/target.search-api
                runner: { runner: e2e-playwright, arguments: { file: e2e/knowledge-journey.test.ts, test: 'JOURNEY-KNOWLEDGE-001: Reopen reads identical durable state' } }
      - id: journey-cli-core-verification
        role: verification
        facet: verification
        responsibility: Verify the same journey postconditions through the local/core CLI with explicit surface=cli transport=core/local evidence identity. CLI remote evidence attaches separately without duplicating these criteria.
        targets:
          - id: core-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_core.rs
            selector: { kind: test, name: test_journey_cli_core_local_durable_outcome }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.space-establish
                covers: [FEAT-STO-001#binding.routing/target.space-command-routing]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_journey_cli_core_local_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.form-establish
                covers: [FEAT-JOURNEY-001#binding.cli-core/target.form-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_journey_cli_core_local_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-create
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_journey_cli_core_local_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-edit
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_journey_cli_core_local_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.search-keyword
                covers: [FEAT-JOURNEY-001#binding.cli-core/target.search-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_journey_cli_core_local_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-history
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_journey_cli_core_local_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-restore
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_journey_cli_core_local_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.reopen
                covers:
                  - FEAT-STO-001#binding.routing/target.space-command-routing
                  - FEAT-API-001#binding.cli-implementation/target.entry-command
                  - FEAT-JOURNEY-001#binding.cli-core/target.search-command
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_journey_cli_core_local_durable_outcome } }
      - id: journey-cli-remote-verification
        role: verification
        facet: verification
        responsibility: Verify the journey postconditions through the server-backed CLI with explicit surface=cli transport=remote evidence identity. Remote Space creation is unreachable for token identities by product design, so space-establish carries core evidence only and the remote journey provisions its Space as fixture setup.
        targets:
          - id: remote-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_remote.rs
            selector: { kind: test, name: journey_cli_remote_reaches_durable_outcome }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.form-establish
                covers: [FEAT-JOURNEY-001#binding.cli-core/target.form-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: journey_cli_remote_reaches_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-create
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: journey_cli_remote_reaches_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-edit
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: journey_cli_remote_reaches_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.search-keyword
                covers: [FEAT-JOURNEY-001#binding.cli-core/target.search-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: journey_cli_remote_reaches_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-history
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: journey_cli_remote_reaches_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.entry-restore
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: journey_cli_remote_reaches_durable_outcome } }
              - kind: verifies
                criterion: REQ-JOURNEY-001#criterion.reopen
                covers:
                  - FEAT-STO-001#binding.routing/target.space-command-routing
                  - FEAT-API-001#binding.cli-implementation/target.entry-command
                  - FEAT-JOURNEY-001#binding.cli-core/target.search-command
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: journey_cli_remote_reaches_durable_outcome } }

  - id: REQ-JOURNEY-002
    title: Mutation semantic parity
    description: 'Failed mutations carry identical error classification and durable meaning on every surface that reaches them. Presentation wording may differ; codes, classification, conflict meaning, and the unchanged durable state must not.'
    priority: high
    status: implemented
    criteria:
      - id: invalid-field
        kind: behavior
        statement: Entries with mistyped field values are rejected with field-identifying validation semantics and persist nothing.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: missing-required
        kind: behavior
        statement: Entries omitting required fields are rejected with field-identifying validation semantics and persist nothing.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: stale-revision
        kind: behavior
        statement: Mutations against a stale parent revision conflict with 409-equivalent semantics and persist nothing.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: restore-unknown-revision
        kind: behavior
        statement: Restoring a nonexistent revision is rejected as not-found and leaves history unchanged.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: missing-form
        kind: behavior
        statement: Entries referencing an unknown Form are rejected with form-identifying classification and persist nothing.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: remote-authorization
        kind: behavior
        statement: Unauthenticated remote mutations are rejected with 401-equivalent semantics and persist nothing. Local core has no auth boundary by design.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
    bindings:
      - id: journey-parity-core-verification
        role: verification
        facet: verification
        responsibility: Verify the parity corpus through the local/core CLI with explicit surface=cli transport=core/local evidence identity.
        targets:
          - id: invalid-field-core-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_core.rs
            selector: { kind: test, name: test_parity_core_invalid_field_rejected_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.invalid-field
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_parity_core_invalid_field_rejected_without_mutation } }
          - id: missing-required-core-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_core.rs
            selector: { kind: test, name: test_parity_core_missing_required_rejected_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.missing-required
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_parity_core_missing_required_rejected_without_mutation } }
          - id: stale-revision-core-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_core.rs
            selector: { kind: test, name: test_parity_core_stale_revision_conflicts_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.stale-revision
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_parity_core_stale_revision_conflicts_without_mutation } }
          - id: restore-unknown-core-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_core.rs
            selector: { kind: test, name: test_parity_core_restore_unknown_revision_rejected_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.restore-unknown-revision
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_parity_core_restore_unknown_revision_rejected_without_mutation } }
          - id: missing-form-core-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_core.rs
            selector: { kind: test, name: test_parity_core_missing_form_rejected_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.missing-form
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_parity_core_missing_form_rejected_without_mutation } }
      - id: journey-parity-remote-verification
        role: verification
        facet: verification
        responsibility: Verify the parity corpus through the server-backed CLI with explicit surface=cli transport=remote evidence identity.
        targets:
          - id: invalid-field-remote-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_remote.rs
            selector: { kind: test, name: test_parity_remote_invalid_field_rejected_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.invalid-field
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: test_parity_remote_invalid_field_rejected_without_mutation } }
          - id: missing-required-remote-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_remote.rs
            selector: { kind: test, name: test_parity_remote_missing_required_rejected_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.missing-required
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: test_parity_remote_missing_required_rejected_without_mutation } }
          - id: stale-revision-remote-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_remote.rs
            selector: { kind: test, name: test_parity_remote_stale_revision_conflicts_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.stale-revision
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: test_parity_remote_stale_revision_conflicts_without_mutation } }
          - id: restore-unknown-remote-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_remote.rs
            selector: { kind: test, name: test_parity_remote_restore_unknown_revision_rejected_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.restore-unknown-revision
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: test_parity_remote_restore_unknown_revision_rejected_without_mutation } }
          - id: missing-form-remote-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_remote.rs
            selector: { kind: test, name: test_parity_remote_missing_form_rejected_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.missing-form
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: test_parity_remote_missing_form_rejected_without_mutation } }
          - id: remote-authorization-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_remote.rs
            selector: { kind: test, name: test_parity_remote_unauthenticated_mutation_rejected_without_mutation }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.remote-authorization
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: test_parity_remote_unauthenticated_mutation_rejected_without_mutation } }
      - id: journey-parity-frontend-verification
        role: verification
        facet: verification
        responsibility: Verify stale-revision conflict semantics through the exact server-backed browser case. Remaining corpus criteria carry CLI evidence only until dedicated Frontend cases exist.
        targets:
          - id: stale-revision-frontend-case
            adapter: typescript
            path: e2e/entries.test.ts
            selector: { kind: test, name: 'PUT with stale revision_id should return 409 conflict' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-002#criterion.stale-revision
                covers: [FEAT-JOURNEY-001#binding.frontend/target.entry-api]
                runner: { runner: e2e-playwright, arguments: { file: e2e/entries.test.ts, test: 'PUT with stale revision_id should return 409 conflict' } }
